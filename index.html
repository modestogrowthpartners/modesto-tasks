<style>
/* =====================================================================
   ADIÇÃO 63 — a página parava de piscar

   Sintoma: a tela "atualiza" sozinha e os ícones pulam.

   Causa: a cada 25 segundos a plataforma busca dados novos e redesenha
   o quadro e a barra INTEIROS. Como os cards e os atalhos têm animação
   de entrada, ela roda de novo a cada ciclo — daí o pulo. E o quadro
   sendo recriado do zero faz a tela piscar.

   Aqui: as animações só rodam na primeira vez, e o redesenho só
   acontece quando algo mudou de verdade.
   ===================================================================== */

/* ---------- 1. as animações não repetem ----------
   Elas existem para a primeira aparição. Depois que o elemento já está
   na tela, repetir é ruído. */
body.mg-ja-carregou .card-t,
body.mg-ja-carregou .mg-atalho,
body.mg-ja-carregou .mg-prog-l,
body.mg-ja-carregou .mg-pj2-c,
body.mg-ja-carregou .mg-bf-sec,
body.mg-ja-carregou .mg-bf-card,
body.mg-ja-carregou .mg-hist-i,
body.mg-ja-carregou .mg-pm-canal,
body.mg-ja-carregou .mg-pc-conta,
body.mg-ja-carregou .mg-cr-i{
  animation:none!important;
}

/* ---------- 2. a barra não repete a entrada ---------- */
body.mg-ja-carregou .mg-dock{animation:none!important}

/* ---------- 3. transições suaves onde faz sentido ----------
   Em vez de o card reaparecer, ele apenas muda. */
.card-t{transition:transform .16s cubic-bezier(.22,1,.36,1), box-shadow .18s, opacity .18s}
@media (prefers-reduced-motion: reduce){
  .card-t{transition:none}
}
</style>
<script>
/* =====================================================================
   ADIÇÃO 63
   ===================================================================== */

/* Depois do primeiro desenho, marcamos a página como "já carregada" e
   as animações de entrada param de valer. */
setTimeout(()=>{ document.body.classList.add('mg-ja-carregou') }, 2500);

/* ---------------------------------------------------------------------
   1. Redesenhar só quando algo mudou

   A cada 25 segundos os dados são buscados e a tela é recriada — mesmo
   quando nada mudou, que é o caso na maior parte das vezes. Comparamos
   uma "assinatura" dos dados antes e depois: igual, não redesenha.
   --------------------------------------------------------------------- */
function mgAssinatura(){
  try{
    const t = (TASKS||[]).map(x =>
      x.id + x.status + (x.position||0) + (x.title||'').length +
      (x.urgente?'1':'0') + (x.archived?'1':'0') + (x.project_id||'') +
      (x.assignees||[]).join('') + (x.due||'') + (x.time_spent||0)
    ).join('|');
    const c = (CLIENTS||[]).map(x => x.id + (x.nome||'')).join('|');
    return t.length + ':' + t + '§' + c;
  }catch(e){ return String(Math.random()) }
}

let MG_ASSINATURA = null;

/* Em vez de trocar `render` durante o refresh — o que deixaria a função
   quebrada se algo falhasse no meio —, deixamos o refresh correr normal
   e barramos o desenho de dentro do próprio render, quando nada mudou. */
let MG_EM_REFRESH = false;

(function(){
  if(typeof refresh !== 'function') return;
  const _rf = refresh;
  refresh = async function(){
    const antes = (MG_ASSINATURA !== null) ? MG_ASSINATURA : mgAssinatura();
    MG_EM_REFRESH = true;
    try{
      return await _rf();
    } finally {
      MG_EM_REFRESH = false;
      const agora = mgAssinatura();
      const mudou = (agora !== antes);
      MG_ASSINATURA = agora;
      if(mudou){ try{ render() }catch(e){} }
    }
  };
})();

(function(){
  if(typeof render !== 'function') return;
  const _r = render;
  render = function(){
    /* durante o refresh, o desenho fica para depois: só acontece se a
       comparação apontar mudança */
    if(MG_EM_REFRESH) return;
    return _r.apply(this, arguments);
  };
})();

/* ---------------------------------------------------------------------
   2. A barra só se reescreve quando o conteúdo muda

   `mgDock` já compara o HTML antes de trocar, mas o menu do usuário
   é recolocado a cada chamada, e isso mexe no DOM. Só recolocamos se
   ele realmente saiu do lugar.
   --------------------------------------------------------------------- */
(function(){
  if(typeof mgMudarEuParaDock !== 'function') return;
  const _mv = mgMudarEuParaDock;
  mgMudarEuParaDock = function(){
    const eu = document.getElementById('mg-eu');
    const dock = document.getElementById('mg-dock');
    /* já está onde deveria: não mexe */
    if(eu && dock && eu.parentElement === dock) return;
    return _mv();
  };
})();

/* ---------------------------------------------------------------------
   3. Os vigias de estado deixam de escrever no DOM à toa

   `mgEstadoDaTela` e `mgPainelAberto` rodam a cada 700ms e 250ms.
   `classList.toggle` com o mesmo valor não muda nada, mas as duas
   funções faziam trabalho extra em volta. Agora saem cedo quando
   não há o que mudar.
   --------------------------------------------------------------------- */
(function(){
  if(typeof mgPainelAberto === 'function'){
    let ultimo = null;
    const _pa = mgPainelAberto;
    mgPainelAberto = function(){
      const slide = document.getElementById('slide');
      const aberto = !!(
        (slide && slide.classList.contains('on')) ||
        document.querySelector('.modal.on') ||
        document.querySelector('.mg-modal.on')
      );
      if(aberto === ultimo) return;      /* nada mudou */
      ultimo = aberto;
      return _pa();
    };
  }
  if(typeof mgEstadoDaTela === 'function'){
    let ultimo = null;
    const _et = mgEstadoDaTela;
    mgEstadoDaTela = function(){
      const app = document.getElementById('app');
      const tour = document.getElementById('tour');
      const chave = (app ? getComputedStyle(app).display : '') +
                    (tour && tour.classList.contains('on') ? '1' : '0');
      if(chave === ultimo) return;
      ultimo = chave;
      return _et();
    };
  }
})();

/* ---------------------------------------------------------------------
   4. Nada de redesenhar com a aba em segundo plano

   O ciclo de 25 segundos já verifica `document.hidden`, mas o cronômetro
   de 5 segundos não. Sem isso, a aba em segundo plano segue trabalhando.
   --------------------------------------------------------------------- */
(function(){
  if(typeof mgAtualizarCron !== 'function') return;
  const _cr = mgAtualizarCron;
  mgAtualizarCron = function(){
    if(document.hidden) return;
    return _cr();
  };
})();
</script>

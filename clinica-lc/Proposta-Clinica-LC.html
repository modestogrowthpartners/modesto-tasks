<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clínica LC · App do Paciente · Proposta Bytech</title>
<style>
:root{
  --bege:#F0EDE6; --bege2:#E7E2D7; --preto:#1A1A18; --dourado:#C9A227;
  --cinza:#4A4A46; --cinza2:#77736B; --linha:#D8D3C8; --branco:#FAFAF7;
  --oliva:#8A6F5C; --olivaC:#B79C89; --creme:#F7F1EA; --marfim:#FDFBF7;
  --vinho:#8C4B3F; --grafite:#2E2B25; --grafiteS:#6B6558; --linhaApp:#E9DFD2;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--preto);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;color:var(--cinza)}
body{overflow:hidden}

/* ---------- deck ---------- */
#deck{position:relative;width:100vw;height:100vh;overflow:hidden}
.slide{position:absolute;inset:0;background:var(--bege);
  display:none;flex-direction:column;overflow-y:auto;
  padding:clamp(28px,4.5vh,60px) clamp(20px,5vw,88px) clamp(72px,9vh,96px)}
.slide.on{display:flex;animation:fade .32s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.slide.center{justify-content:center;align-items:center;text-align:center}

.eyebrow{font-size:clamp(10px,1.05vw,13px);font-weight:700;letter-spacing:.22em;
  text-transform:uppercase;color:var(--dourado);margin:0 0 10px;
  border-left:3px solid var(--dourado);padding-left:10px}
.slide.center .eyebrow{border:0;padding:0}
h1{font-family:var(--serif);font-weight:700;color:var(--preto);
  font-size:clamp(30px,5.4vw,72px);line-height:1.08;margin:0 0 14px;letter-spacing:-.015em}
h2{font-family:var(--serif);font-weight:700;color:var(--preto);
  font-size:clamp(24px,3.5vw,46px);line-height:1.12;margin:0 0 6px;letter-spacing:-.01em}
h3{font-size:clamp(13px,1.35vw,17px);font-weight:700;color:var(--dourado);
  margin:0 0 10px;letter-spacing:.02em}
.lead{font-size:clamp(14px,1.5vw,21px);line-height:1.5;color:var(--cinza);
  margin:0 0 22px;max-width:74ch}
.slide.center .lead{margin-left:auto;margin-right:auto}
p{font-size:clamp(13px,1.15vw,16px);line-height:1.6;margin:0 0 12px}
.small{font-size:clamp(11px,.95vw,13.5px);color:var(--cinza2);line-height:1.55}
strong{color:var(--preto);font-weight:700}
.rule{height:2px;background:var(--dourado);width:64px;margin:16px 0 26px;border:0}
.slide.center .rule{margin-left:auto;margin-right:auto}

/* grid de cards */
.grid{display:grid;gap:clamp(10px,1.3vw,18px);width:100%}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--branco);border:1px solid var(--linha);border-radius:14px;
  padding:clamp(13px,1.5vw,22px)}
.card h4{margin:0 0 7px;font-size:clamp(13px,1.25vw,17px);color:var(--preto);
  font-weight:700;font-family:var(--sans)}
.card p{margin:0;font-size:clamp(11.5px,1vw,14.5px);line-height:1.55;color:var(--cinza)}
.card.dark{background:var(--preto);border-color:var(--preto)}
.card.dark h4,.card.dark .big{color:var(--bege)}
.card.dark p{color:#B9B5AC}
.tagn{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dourado);margin-bottom:6px}
.big{font-family:var(--serif);font-size:clamp(26px,3.4vw,46px);font-weight:700;
  color:var(--preto);line-height:1;display:block;margin-bottom:4px}
.big.gold{color:var(--dourado)}

/* citação do transcript */
.quote{background:var(--branco);border-left:4px solid var(--dourado);
  border-radius:0 12px 12px 0;padding:clamp(13px,1.5vw,20px) clamp(15px,1.8vw,24px)}
.quote p{font-style:italic;color:var(--preto);margin:0 0 7px;
  font-size:clamp(12.5px,1.1vw,16px);line-height:1.5}
.quote cite{font-style:normal;font-size:clamp(10.5px,.9vw,12.5px);
  color:var(--cinza2);font-weight:600}

/* tabela */
table{width:100%;border-collapse:collapse;background:var(--branco);
  border:1px solid var(--linha);border-radius:12px;overflow:hidden;
  font-size:clamp(11.5px,1.05vw,15px)}
thead th{background:var(--preto);color:var(--bege);text-align:left;
  padding:11px 14px;font-size:clamp(9.5px,.85vw,12px);font-weight:700;
  letter-spacing:.13em;text-transform:uppercase}
td{padding:10px 14px;border-top:1px solid var(--linha);color:var(--cinza);vertical-align:top}
tbody tr:nth-child(even) td{background:#F5F2EA}
td.num,th.num{text-align:right;white-space:nowrap}
tr.total td{background:var(--bege2)!important;font-weight:700;color:var(--preto)}
.chk{color:var(--dourado);font-weight:700}

/* timeline */
.tl{display:flex;gap:8px;width:100%;margin-top:6px;flex-wrap:wrap}
.tl-i{flex:1 1 150px;background:var(--branco);border:1px solid var(--linha);
  border-radius:12px;padding:12px 13px;border-top:3px solid var(--dourado)}
.tl-i .wk{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--dourado);
  text-transform:uppercase;margin-bottom:5px}
.tl-i .tt{font-size:clamp(12px,1.05vw,14.5px);font-weight:700;color:var(--preto);
  margin-bottom:4px;line-height:1.25}
.tl-i .ds{font-size:clamp(10.5px,.9vw,12.5px);color:var(--cinza2);line-height:1.45}
.tl-i.mk{border-top-color:var(--preto);background:var(--bege2)}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;
  align-items:center;gap:14px;padding:0 clamp(16px,4vw,44px);
  background:rgba(240,237,230,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--linha);z-index:80}
#bar{flex:1;height:3px;background:var(--linha);border-radius:9px;overflow:hidden}
#barf{height:100%;width:0;background:var(--dourado);transition:width .3s}
.nbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--linha);
  background:var(--branco);cursor:pointer;color:var(--preto);font-size:15px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.nbtn:hover{background:var(--preto);color:var(--bege);border-color:var(--preto)}
#cnt{font-size:12px;color:var(--cinza2);font-weight:600;min-width:52px;
  text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
#brand{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--cinza2);font-weight:700;flex-shrink:0}
@media(max-width:720px){#brand{display:none}}

/* editável */
[contenteditable]{outline:none;border-bottom:2px dashed var(--dourado);
  padding:0 3px;cursor:text;min-width:1ch;display:inline-block}
[contenteditable]:focus{background:#FFF8E3;border-bottom-style:solid}
.edit-hint{display:inline-flex;align-items:center;gap:6px;font-size:11px;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dourado);
  background:#FBF6E6;border:1px solid #EADFB8;border-radius:99px;padding:5px 12px}

/* ================= PROTÓTIPO ================= */
.protowrap{display:flex;gap:clamp(16px,3vw,52px);align-items:center;
  justify-content:center;width:100%;flex-wrap:wrap}
.phone{width:330px;height:668px;background:var(--creme);border-radius:42px;
  border:9px solid var(--grafite);box-shadow:0 24px 50px rgba(46,43,37,.28);
  position:relative;overflow:hidden;flex-shrink:0;
  font-family:var(--sans);color:var(--grafite)}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:128px;
  height:23px;background:var(--grafite);border-radius:0 0 14px 14px;z-index:40}
.sbar{display:flex;justify-content:space-between;align-items:center;
  padding:12px 20px 5px;font-size:11.5px;font-weight:700;color:var(--grafite)}
.sbar .ic{display:flex;gap:5px;align-items:center}
.screen{height:calc(100% - 36px);position:relative;overflow-y:auto;scrollbar-width:thin}
.screen::-webkit-scrollbar{width:0}
.phd{padding:4px 20px 14px;display:flex;justify-content:space-between;align-items:flex-end}
.phd .eb{font-size:11.5px;color:var(--grafiteS);margin-bottom:2px}
.phd .tt{font-family:var(--serif);font-size:22px;color:var(--grafite);line-height:1.14}
.pbody{padding:0 20px 92px;display:flex;flex-direction:column;gap:11px}
.pc{background:var(--marfim);border:1px solid var(--linhaApp);border-radius:15px;padding:14px}
.pc.oliva{background:var(--oliva);border-color:var(--oliva);color:var(--marfim)}
.prow{display:flex;justify-content:space-between;align-items:center}
.plabel{font-size:11.5px;color:var(--grafiteS);margin-bottom:3px}
.pc.oliva .plabel{color:#EFE3D6}
.ptit{font-family:var(--serif);font-size:15px;color:var(--grafite)}
.pstrong{font-weight:600;font-size:13px;color:var(--grafite)}
.psub{font-size:12px;color:var(--grafiteS)}
.pill{font-size:10.5px;font-weight:700;color:var(--marfim);background:var(--dourado);
  border-radius:99px;padding:4px 9px;white-space:nowrap}
.bar{height:7px;background:var(--linhaApp);border-radius:99px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--oliva);border-radius:99px;transition:width .3s}
.bar.gold i{background:var(--dourado)}
.btn-s{display:inline-flex;align-items:center;gap:4px;background:none;
  border:1px solid var(--oliva);border-radius:8px;padding:3px 9px;cursor:pointer;
  color:var(--oliva);font-size:11.5px;font-weight:600;font-family:inherit}
.btn-s:hover{background:var(--oliva);color:var(--marfim)}
.btn-p{background:var(--oliva);color:var(--marfim);border:0;border-radius:11px;
  padding:12px 0;font-weight:600;font-size:13.5px;cursor:pointer;width:100%;
  font-family:inherit;margin-top:4px}
.btn-p:hover{background:#78604F}
.btn-o{background:transparent;color:var(--oliva);border:1px solid var(--oliva);
  border-radius:11px;padding:11px 0;font-weight:600;font-size:13.5px;cursor:pointer;
  width:100%;font-family:inherit;margin-top:8px}
.btn-o.vinho{color:var(--vinho);border-color:var(--vinho)}
.tsk{display:flex;align-items:center;gap:9px;padding:7px 0;cursor:pointer}
.tsk+.tsk{border-top:1px solid var(--linhaApp)}
.tsk .bx{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--linhaApp);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tsk.done .bx{background:var(--oliva);border-color:var(--oliva)}
.tsk .lb{font-size:13px;color:var(--grafite)}
.tsk.done .lb{color:var(--grafiteS);text-decoration:line-through}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;color:var(--grafiteS);margin-bottom:5px}
.fld input,.fld textarea{width:100%;border:1px solid var(--linhaApp);border-radius:9px;
  padding:9px 11px;font-family:inherit;font-size:13px;color:var(--grafite);
  background:var(--marfim);resize:none}
.fld input:focus,.fld textarea:focus{outline:0;border-color:var(--oliva)}
.tabs{display:flex;gap:7px;padding:0 20px 14px}
.tab{flex:1;padding:9px 0;border-radius:11px;border:1px solid var(--linhaApp);
  background:transparent;color:var(--grafiteS);font-size:12px;font-weight:600;
  cursor:pointer;font-family:inherit}
.tab.on{background:var(--oliva);border-color:var(--oliva);color:var(--marfim)}
.slot{font-size:12px;font-weight:600;color:var(--oliva);border:1px solid var(--oliva);
  border-radius:9px;padding:5px 11px;background:none;cursor:pointer;font-family:inherit}
.slot:hover{background:var(--oliva);color:var(--marfim)}
.nav5{position:absolute;bottom:0;left:0;right:0;background:var(--marfim);
  border-top:1px solid var(--linhaApp);display:flex;padding:8px 4px 16px;z-index:20}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:0;cursor:pointer;padding:3px 0;color:var(--grafiteS);font-family:inherit}
.nv span{font-size:9.5px;font-weight:600}
.nv.on{color:var(--oliva)}
.nv.on span{font-weight:700}
.sheet{position:absolute;top:36px;left:0;right:0;bottom:0;background:var(--creme);
  z-index:30;display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;padding:15px 20px 8px}
.sheet .sh b{font-family:var(--serif);font-size:17px;color:var(--grafite);font-weight:700}
.sheet .sb{flex:1;overflow-y:auto;padding:0 20px 22px}
.xbtn{background:none;border:0;cursor:pointer;padding:4px;color:var(--grafiteS);line-height:0}
.rk{display:flex;justify-content:space-between;align-items:center;padding:7px 0}
.rk+.rk{border-top:1px solid var(--linhaApp)}
.rk .pos{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-family:var(--serif);font-size:12.5px;color:var(--grafite)}
.rk.me .pos{background:var(--oliva);color:var(--marfim)}
.rk.me .nm{font-weight:700}
.tg{width:41px;height:24px;border-radius:99px;background:var(--linhaApp);
  position:relative;cursor:pointer;flex-shrink:0;transition:background .15s}
.tg i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:var(--marfim);transition:left .15s}
.tg.on{background:var(--oliva)}
.tg.on i{left:20px}
/* legenda do protótipo */
.plegend{max-width:340px;min-width:250px}
.plegend ol{margin:0;padding-left:19px}
.plegend li{font-size:clamp(11.5px,1vw,14.5px);line-height:1.5;color:var(--cinza);
  margin-bottom:9px}
.plegend li b{color:var(--preto)}
.slide.proto{padding-top:clamp(16px,2.4vh,34px);padding-bottom:clamp(64px,8vh,84px)}
.slide.proto h2{font-size:clamp(20px,2.9vw,38px);margin-bottom:4px}
.slide.proto .lead{font-size:clamp(12.5px,1.2vw,16.5px);margin-bottom:10px}
.phone{transform-origin:center center}
@media(max-height:1000px){.phone{transform:scale(.88);margin:-41px 0}}
@media(max-height:880px){.phone{transform:scale(.78);margin:-75px 0}}
@media(max-height:780px){.phone{transform:scale(.68);margin:-110px 0}}
@media(max-height:680px){.phone{transform:scale(.58);margin:-144px 0}}
@media(max-width:900px){.phone{transform:scale(.82);margin:-62px 0}}
@media(max-width:860px){.g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="deck"></div>
<div id="nav">
  <span id="brand">Bytech</span>
  <button class="nbtn" id="prev" title="Anterior (←)">&#8592;</button>
  <button class="nbtn" id="next" title="Próximo (→)">&#8594;</button>
  <div id="bar"><div id="barf"></div></div>
  <span id="cnt">1 / 14</span>
  <button class="nbtn" id="fs" title="Tela cheia (F)">&#9974;</button>
</div>
<script>
const sv=(d,s=16,extra="")=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;${extra}">${d}</svg>`;
const ICON={
 signal: sv('<path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4"/>',12),
 wifi:   sv('<path d="M5 13a10 10 0 0 1 14 0M8.5 16.5a5 5 0 0 1 7 0M2 8.8a15 15 0 0 1 20 0"/><circle cx="12" cy="20" r=".5" fill="currentColor"/>',12),
 batt:   sv('<rect x="2" y="7" width="16" height="10" rx="2"/><path d="M22 11v2"/><rect x="4" y="9" width="12" height="6" rx="1" fill="currentColor" stroke="none"/>',14),
 home:   sv('<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',19),
 meal:   sv('<path d="M3 2v7c0 1.1.9 2 2 2h1a2 2 0 0 0 2-2V2M5 2v7M16 2v20M20 2v8c0 1.5-1 2.5-2 2.5"/>',19),
 cal:    sv('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',19),
 trend:  sv('<path d="M22 7l-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',19),
 user:   sv('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',19),
 drop:   sv('<path d="M12 2.7l5.3 5.3a7.5 7.5 0 1 1-10.6 0z"/>',17),
 plus:   sv('<path d="M12 5v14M5 12h14"/>',12),
 check:  sv('<path d="M20 6L9 17l-5-5"/>',12),
 flame:  sv('<path d="M12 2s5 4.5 5 9a5 5 0 0 1-10 0c0-1.5.5-2.8 1.3-3.8C9 9 12 7 12 2z"/>',21),
 award:  sv('<circle cx="12" cy="8" r="6"/><path d="M8.2 13.9L7 22l5-3 5 3-1.2-8.1"/>',17),
 clock:  sv('<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',13),
 chev:   sv('<path d="M9 18l6-6-6-6"/>',17),
 bell:   sv('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',17),
 lock:   sv('<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',15),
 msg:    sv('<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.4 8.4 0 0 1-3.8-.9L3 21l2-4.9A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>',15),
 x:      sv('<path d="M18 6L6 18M6 6l12 12"/>',20),
 cog:    sv('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a1.7 1.7 0 0 0-1.6-1H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 3 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 3a1.7 1.7 0 0 0 1-1.6V1a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 15 3a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 9v0a1.7 1.7 0 0 0 1.6 1h.4a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',16),
 out:    sv('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',14),
 heart:  sv('<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',24),
 pin:    sv('<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',14)
};

const S = [];

/* 1. CAPA */
S.push(`<div class="slide center">
  <p class="eyebrow">Proposta de desenvolvimento · 15 de setembro de 2026</p>
  <h1>Clínica LC<br>App do Paciente</h1>
  <hr class="rule">
  <p class="lead">Um aplicativo que transforma o protocolo médico em rotina diária acompanhada,
  tira o agendamento do horário comercial e aproxima o paciente da clínica todos os dias,
  não só no dia da consulta.</p>
  <div class="grid g3" style="max-width:840px;margin-top:12px">
    <div class="card"><span class="big gold">iOS</span><p>App Store</p></div>
    <div class="card"><span class="big gold">Android</span><p>Google Play</p></div>
    <div class="card"><span class="big gold">14</span><p>semanas até a publicação</p></div>
  </div>
  <p class="small" style="margin-top:26px">Use as setas do teclado para navegar &nbsp;·&nbsp; Tecla F para tela cheia</p>
</div>`);

/* 2. O QUE OUVIMOS */

    <div class="pc" style="margin-bottom:16px"><div class="ptit">${esc(st.od.p)}</div>
      <div class="psub" style="margin-bottom:8px">${esc(st.od.a)}</div>
      <div style="display:flex;align-items:center;gap:6px;color:var(--oliva)">${ICON.clock}
        <span style="font-size:12.5px;color:var(--grafite)">Próxima terça-feira · ${esc(st.od.h)}</span></div></div>
    <div class="psub" style="margin-bottom:16px">Cancelamento gratuito até 24 horas antes do horário marcado</div>
    <button class="btn-p" data-a="confirmBook">Confirmar agendamento</button>
    <button class="btn-o" data-a="close">Voltar</button>`);}

function ovCancel(){
  const c=st.cons.find(x=>x.id===st.od);
  if(!c) return "";
  return sheet("Cancelar consulta", `
    <div class="pc" style="margin-bottom:16px"><div class="ptit">${esc(c.p)}</div>
      <div class="psub" style="margin-bottom:8px">${esc(c.a)}</div>
      <div style="display:flex;align-items:center;gap:6px;color:var(--oliva)">${ICON.clock}
        <span style="font-size:12.5px;color:var(--grafite)">${esc(c.d)} · ${esc(c.h)}</span></div></div>
    <div class="psub" style="margin-bottom:16px">Essa consulta está dentro do prazo de cancelamento gratuito de 24 horas</div>
    <button class="btn-o vinho" style="margin-top:0" data-a="doCancel" data-id="${c.id}">Confirmar cancelamento</button>
    <button class="btn-p" data-a="close">Manter consulta</button>`);}

function ovCfg(){
  const rows=[["notif","Notificações push","Lembretes e mensagens motivacionais"],
    ["wpp","Integração com WhatsApp","Encaminhar mensagens da clínica para o seu WhatsApp"],
    ["mail","E-mails da clínica","Novidades, lembretes e resumos por e-mail"]];
  return sheet("Configurações", `<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
    ${rows.map(r=>`<div class="pc prow" style="gap:10px"><div>
      <div class="pstrong" style="margin-bottom:2px">${r[1]}</div>
      <div class="psub" style="font-size:11.5px">${r[2]}</div></div>
      <div class="tg ${st.cfg[r[0]]?'on':''}" data-a="tg" data-k="${r[0]}"><i></i></div></div>`).join("")}</div>
    <button class="btn-o vinho" style="margin-top:0" data-a="sair">${ICON.out} Sair da conta</button>`);}

/* ---------- render do protótipo ---------- */
const TABS=[["inicio","Início",ICON.home],["diario","Diário",ICON.meal],
  ["agenda","Agenda",ICON.cal],["evolucao","Evolução",ICON.trend],["perfil","Perfil",ICON.user]];

function renderPhone(){
  const scr=document.getElementById("screen"); if(!scr) return;
  const nav=document.getElementById("nav5");
  if(st.auth==="login"){ scr.innerHTML=scLogin(); nav.innerHTML=""; nav.style.display="none"; return; }
  if(st.auth==="cadastro"){ scr.innerHTML=scCad(); nav.innerHTML=""; nav.style.display="none"; return; }
  nav.style.display="flex";
  const map={inicio:scInicio,diario:scDiario,agenda:scAgenda,evolucao:scEvol,perfil:scPerfil};
  let html = map[st.tab]();
  if(st.overlay==="notif") html+=ovNotif();
  if(st.overlay==="meal")  html+=ovMeal();
  if(st.overlay==="book")  html+=ovBook();
  if(st.overlay==="cancel")html+=ovCancel();
  if(st.overlay==="cfg")   html+=ovCfg();
  scr.innerHTML=html;
  nav.innerHTML=TABS.map(t=>`<button class="nv ${st.tab===t[0]?'on':''}" data-a="tab" data-t="${t[0]}">
    ${t[2]}<span>${t[1]}</span></button>`).join("");
}

/* ---------- interação do protótipo ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a;
  if(a==="login"){st.auth="app";st.tab="inicio";}
  else if(a==="cad"){st.auth="cadastro";}
  else if(a==="volta"){st.auth="login";}
  else if(a==="tab"){st.tab=el.dataset.t;st.overlay=null;}
  else if(a==="agua"){st.agua=Math.min(st.agua+250,st.meta);}
  else if(a==="tsk"){const i=+el.dataset.i;st.rotina[i].d=!st.rotina[i].d;}
  else if(a==="notif"){st.overlay="notif";}
  else if(a==="cfg"){st.overlay="cfg";}
  else if(a==="close"){st.overlay=null;st.od=null;}
  else if(a==="meal"){st.overlay="meal";st.od=el.dataset.n;}
  else if(a==="saveMeal"){
    const d=document.getElementById("mDesc").value.trim();
    const k=parseInt(document.getElementById("mKcal").value,10);
    st.ref[st.od]={r:true,t:d||"Refeição registrada",k:isNaN(k)?0:k};
    st.overlay=null;st.od=null;}
  else if(a==="agtab"){st.agTab=el.dataset.t;}
  else if(a==="book"){st.overlay="book";st.od={p:el.dataset.p,a:el.dataset.ar,h:el.dataset.h,done:false};}
  else if(a==="confirmBook"){
    st.cons.push({id:Date.now(),p:st.od.p,a:st.od.a,d:"Próxima terça",h:st.od.h,s:"ok"});
    st.od={...st.od,done:true};}
  else if(a==="cancel"){st.overlay="cancel";st.od=+el.dataset.id;}
  else if(a==="doCancel"){
    const id=+el.dataset.id;
    st.cons=st.cons.map(c=>c.id===id?{...c,s:"x"}:c);
    st.overlay=null;st.od=null;st.agTab="minhas";}
  else if(a==="tg"){st.cfg[el.dataset.k]=!st.cfg[el.dataset.k];}
  else if(a==="sair"){st.auth="login";st.tab="inicio";st.overlay=null;st.od=null;}
  else return;
  renderPhone();
});

/* ================= NAVEGAÇÃO DO DECK ================= */
const deck=document.getElementById("deck");
deck.innerHTML=S.join("");
const slides=[...deck.querySelectorAll(".slide")];
let cur=0;
const barf=document.getElementById("barf"), cnt=document.getElementById("cnt");

function show(i){
  cur=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,k)=>s.classList.toggle("on",k===cur));
  barf.style.width=((cur+1)/slides.length*100)+"%";
  cnt.textContent=(cur+1)+" / "+slides.length;
  slides[cur].scrollTop=0;
  if(slides[cur].querySelector("#phone")) renderPhone();
}
document.getElementById("prev").onclick=()=>show(cur-1);
document.getElementById("next").onclick=()=>show(cur+1);
document.getElementById("fs").onclick=()=>{
  document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();};
document.addEventListener("keydown",e=>{
  if(e.target.isContentEditable||/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" ") {e.preventDefault();show(cur+1);}
  if(e.key==="ArrowLeft"||e.key==="PageUp") {e.preventDefault();show(cur-1);}
  if(e.key==="Home") show(0);
  if(e.key==="End") show(slides.length-1);
  if(e.key.toLowerCase()==="f") document.getElementById("fs").click();
});

/* ================= CÁLCULO DO INVESTIMENTO ================= */
const num = s => { const d=String(s).replace(/[^\d,]/g,"").replace(",","."); const v=parseFloat(d); return isNaN(v)?0:v; };
const fmt = v => v.toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:0});
function calc(){
  const hon=num(document.getElementById("fHon").textContent);
  const tot=hon+694;
  document.getElementById("fTot").textContent = hon>0?fmt(tot):"—";
  [["p1","v1"],["p2","v2"],["p3","v3"]].forEach(([p,v])=>{
    const pc=num(document.getElementById(p).textContent);
    document.getElementById(v).textContent = hon>0?fmt(hon*pc/100):"—";
  });
}
["fHon","fMen","p1","p2","p3"].forEach(id=>{
  const el=document.getElementById(id); if(!el) return;
  el.addEventListener("input",calc);
  el.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();el.blur();}});
});
calc();
show(0);
</script>
